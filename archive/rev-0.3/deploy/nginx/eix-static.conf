location = /eix {
    return 302 /eix/;
}

location ^~ /eix/ {
    alias /opt/eix/current/;
    index index.html;
    autoindex off;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
}
